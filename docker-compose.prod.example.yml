# Example production topology. Copy to docker-compose.prod.yml, fill in
# real values in a production .env, and run:
#   docker compose -f docker-compose.prod.yml up -d
#
# Object storage (S3/R2/ArvanCloud) and SMTP are expected to be external,
# managed services in production — MinIO and Mailpit are local-development
# only and are intentionally NOT part of this file. Postgres is included
# here for convenience; a managed Postgres (RDS, Cloud SQL, etc.) is an
# equally valid choice — just point DATABASE_URL at it and drop the
# `postgres` service below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - renas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Only the optional client-side analytics/anti-spam keys are baked
        # in at build time — API_URL/WEB_URL/PREVIEW_SECRET/REVALIDATE_SECRET
        # and the /api/v1 proxy in src/middleware.ts are read from
        # env_file/.env.production at runtime instead, so redeploying with a
        # new API_URL never requires a rebuild.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file: .env.production
    depends_on: [api]
    networks: [internal, edge]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on: [api]
    networks: [internal, edge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/renas.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, admin, api]
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

volumes:
  renas_postgres_data:
