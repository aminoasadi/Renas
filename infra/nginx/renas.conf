# Example production reverse-proxy configuration.
#
# This assumes TLS termination happens here (via certbot/Let's Encrypt or
# a managed certificate) — it does NOT generate or bundle fake certificates.
# Point `ssl_certificate`/`ssl_certificate_key` at real files you provision
# separately (e.g. certbot's /etc/letsencrypt/live/<domain>/).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# ---- renasxgroup.com -> web ----
server {
  listen 80;
  server_name renasxgroup.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name renasxgroup.com;

  ssl_certificate     /etc/nginx/certs/renasxgroup.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/renasxgroup.com/privkey.pem;

  client_max_body_size 20m; # room for RFQ attachments

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ---- admin.renasxgroup.com -> admin ----
server {
  listen 80;
  server_name admin.renasxgroup.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name admin.renasxgroup.com;

  ssl_certificate     /etc/nginx/certs/admin.renasxgroup.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/admin.renasxgroup.com/privkey.pem;

  client_max_body_size 20m; # media library uploads

  # The CMS should not be indexed.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://admin:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ---- api.renasxgroup.com -> api ----
server {
  listen 80;
  server_name api.renasxgroup.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.renasxgroup.com;

  ssl_certificate     /etc/nginx/certs/api.renasxgroup.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/api.renasxgroup.com/privkey.pem;

  client_max_body_size 20m; # media/attachment uploads pass through here too

  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://api:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Real client IP matters here specifically for OTP/RFQ rate limiting.
  }
}
