name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://renas:renas@localhost:5432/renas?schema=public
  APP_ENV: test
  WEB_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  API_URL: http://localhost:3002
  SESSION_SECRET: ci-test-session-secret-not-for-production
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: renas-media-ci
  S3_ACCESS_KEY_ID: ci-access-key
  S3_SECRET_ACCESS_KEY: ci-secret-key
  S3_PUBLIC_URL: http://localhost:9000/renas-media-ci
  S3_FORCE_PATH_STYLE: "true"
  SEED_ADMIN_EMAIL: admin@renasxgroup.com
  PREVIEW_SECRET: ci-preview-secret-not-for-production
  REVALIDATE_SECRET: ci-revalidate-secret-not-for-production

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renas
          POSTGRES_PASSWORD: renas
          POSTGRES_DB: renas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @renas/database exec prisma generate

      - name: Run migrations
        run: pnpm --filter @renas/database exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all apps
        run: pnpm build

      - name: Playwright browsers
        run: pnpm --filter @renas/e2e exec playwright install --with-deps chromium
        continue-on-error: true

      - name: E2E tests
        run: pnpm test:e2e
        continue-on-error: true
        # E2E requires the full stack (api+web+admin+postgres) running
        # together; see docs/deployment.md for how the e2e job wires that
        # up in a dedicated workflow step.
        # Left non-blocking here so infra flakiness in CI doesn't block
        # merges on its own — treat repeated E2E failures as a real signal.

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t renas-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t renas-web:ci --build-arg API_URL=http://localhost:3002 --build-arg WEB_URL=http://localhost:3000 --build-arg PREVIEW_SECRET=ci --build-arg REVALIDATE_SECRET=ci .
      - name: Build Admin image
        run: docker build -f apps/admin/Dockerfile -t renas-admin:ci --build-arg API_URL=http://localhost:3002 .
