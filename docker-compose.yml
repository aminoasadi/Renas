# Local development infrastructure only.
# Application services (web/admin/api) run via `pnpm dev` on the host during
# development for fast iteration. See docker-compose.prod.example.yml for the
# production topology where every app also runs in a container.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: renas
      POSTGRES_PASSWORD: renas
      POSTGRES_DB: renas
    ports:
      - target: 5432
        published: "5434"
        protocol: tcp
    volumes:
      - renas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renas"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renas-minio
      MINIO_ROOT_PASSWORD: renas-minio-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - renas_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 renas-minio renas-minio-secret &&
      mc mb --ignore-existing local/renas-media &&
      mc anonymous set download local/renas-media
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  renas_postgres_data:
  renas_minio_data:
